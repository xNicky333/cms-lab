services:
  db:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wp
      MARIADB_PASSWORD: wp_haslo
      MARIADB_ROOT_PASSWORD: root_haslo
    volumes:
      - db_data:/var/lib/mysql

  wordpress:
    image: wordpress:php8.3-apache
    depends_on: [db]
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: wp_haslo
      WORDPRESS_DB_NAME: wordpress
      CODESPACE_NAME: ${CODESPACE_NAME}
      PF_DOMAIN: ${GITHUB_CODESPACES_PORT_FORWARDING_DOMAIN}
      WORDPRESS_CONFIG_EXTRA: |
        $$u = 'https://' . getenv('CODESPACE_NAME') . '-8080.' . getenv('PF_DOMAIN');
        define('WP_HOME', $$u); define('WP_SITEURL', $$u);
        $$_SERVER['HTTPS'] = 'on';
    volumes:
      - ./wp-content:/var/www/html/wp-content

volumes:
  db_data:
